name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repozitoriyni yuklash
        uses: actions/checkout@v4

      - name: Python-ni o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: EXE dasturini yig'ish (Build)
        run: |
          pyinstaller --noconsole --onefile --collect-all customtkinter --name="Korrupsiya_Monitoring" main.py

      - name: Tayyor EXE faylni yuklab olish uchun saqlash (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Korrupsiya_Monitoring_EXE
          path: dist/Korrupsiya_Monitoring.exe
