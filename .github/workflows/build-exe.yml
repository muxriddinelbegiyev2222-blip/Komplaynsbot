name: Build EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repozitoriyani yuklash
        uses: actions/checkout@v4

      - name: Python o‘rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o‘rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Belgini (icon) yaratish va papkani tayyorlash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets"
          if (Test-Path "create_icon.py") { python create_icon.py }
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" -Destination "assets\icon.ico" -Force }

      - name: EXE yaratish (PyInstaller)
        shell: pwsh
        run: |
          $iconArg = if (Test-Path "assets\icon.ico") { '--icon="assets\icon.ico"' } elseif (Test-Path "icon.ico") { '--icon="icon.ico"' } else { '' }
          Invoke-Expression "pyinstaller --noconsole --onefile --name ""Korrupsiya_Monitoring"" $iconArg --hidden-import=gspread --hidden-import=oauth2client --hidden-import=oauth2client.service_account --hidden-import=google.auth --hidden-import=openpyxl --hidden-import=pandas --hidden-import=requests --hidden-import=urllib3 --hidden-import=PIL main.py"

      - name: EXE faylni saqlash (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Korrupsiya_Monitoring-EXE
          path: dist/Korrupsiya_Monitoring.exe
