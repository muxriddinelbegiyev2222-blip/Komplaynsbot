name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install customtkinter pandas openpyxl python-docx pillow
          pip install gspread oauth2client requests urllib3

      - name: Build EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --name="Komplaynsbot" --onefile --windowed --add-data "src;src" --add-data "assets;assets" --hidden-import="src" --hidden-import="src.data_loader" --hidden-import="src.db_manager" --hidden-import="src.ui_dashboard" --hidden-import="src.report_generator" --hidden-import="customtkinter" --hidden-import="pandas" --hidden-import="openpyxl" --hidden-import="docx" --hidden-import="PIL" --hidden-import="gspread" --hidden-import="oauth2client" --collect-all customtkinter --collect-all pandas main.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Komplaynsbot-Windows
          path: dist/Komplaynsbot.exe
          retention-days: 30
