name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repozitoriyni yuklash
        uses: actions/checkout@v4

      - name: Python-ni o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Barcha kerakli kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl customtkinter matplotlib pillow python-docx pyinstaller

      - name: Rasmiy idoraviy nishon va logotipni hosil qilish
        run: |
          python create_icon.py

      - name: EXE dasturini maxsus logo-icon bilan yig'ish
        run: |
          pyinstaller --noconsole --onefile `
            --icon="assets/app_icon.ico" `
            --add-data "assets;assets" `
            --copy-metadata pandas `
            --hidden-import=pandas `
            --hidden-import=openpyxl `
            --hidden-import=PIL `
            --hidden-import=docx `
            --collect-all customtkinter `
            --collect-all pandas `
            --collect-all openpyxl `
            --collect-all docx `
            --name="Korrupsiya_Monitoring" main.py

      - name: Tayyor EXE faylni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Korrupsiya_Monitoring_EXE
          path: dist/Korrupsiya_Monitoring.exe
